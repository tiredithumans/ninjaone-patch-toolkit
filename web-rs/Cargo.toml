[package]
name = "ninjaone-patch-toolkit-web"
version = "0.14.0"
edition = "2024"
rust-version = "1.98"
description = "Leptos CSR frontend for the NinjaOne Patch Toolkit"
license = "MIT OR Apache-2.0"
publish = false

[features]
# Marks the bundle as the one the Tauri webview loads. Additive and off by default,
# so every plain `cargo`/`trunk` invocation still builds the browser demo; only
# tauri.conf.json's before-commands turn it on. With it, a missing `window.__TAURI__`
# is a hard error instead of a silent fall back to sample data — see
# `api::is_desktop_build`.
desktop = []

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
# Already in the tree through leptos; listed here only to enable the DOM features
# the modal focus trap needs (query the focusable descendants of a dialog and
# move focus among them), which leptos does not turn on itself.
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlElement", "KeyboardEvent", "Node", "NodeList"] }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
gloo-timers = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
