name: Pages

# Publishes the Leptos/WASM frontend to GitHub Pages as a live demo. With no Tauri
# backend in a browser, the app detects this (api::is_tauri) and renders bundled
# sample data instead of calling IPC — sign-in / live query / export are disabled.
on:
  push:
    branches: [main]
    paths:
      - "web-rs/**"
      - "justfile"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Least-privilege by default. Only `deploy` holds the two scopes publishing needs:
# `build` compiles the whole frontend dependency tree (build scripts and proc-macros
# run arbitrary code), and must not be able to mint an OIDC token or write Pages.
permissions:
  contents: read

# Never cancel an in-flight deploy; let the running publish finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build (Leptos/WASM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # configure-pages only reads the site's Pages settings.
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: web-rs
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: just,trunk
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # Builds with the base href set to the repo subpath so assets resolve under
      # https://<user>.github.io/<repo>/. The desktop build keeps the "/" default.
      - name: Build for Pages
        run: just web-build-pages
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web-rs/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
