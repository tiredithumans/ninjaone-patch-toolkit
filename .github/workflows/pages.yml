name: Pages

# Publishes the Leptos/WASM frontend to GitHub Pages as a live demo. With no Tauri
# backend in a browser, the app detects this (api::is_tauri) and renders bundled
# sample data instead of calling IPC — sign-in / live query / export are disabled.
on:
  push:
    branches: [main]
    paths:
      - "web-rs/**"
      - "justfile"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Least-privilege, plus the two scopes the Pages deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight deploy; let the running publish finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build (Leptos/WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: web-rs
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: just,trunk
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # Builds with the base href set to the repo subpath so assets resolve under
      # https://<user>.github.io/<repo>/. The desktop build keeps the "/" default.
      - name: Build for Pages
        run: just web-build-pages
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web-rs/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
