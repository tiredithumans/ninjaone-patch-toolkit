name: Screenshot

# Regenerates the README demo screenshot (docs/images/screenshot.png) by driving the
# built web demo in headless Chromium, then opens a PR with the refreshed image.
# Runs automatically when a release is published (so the README image tracks each
# shipped version) and on manual dispatch — run it after a UI change you want
# reflected in the README. Either way it only opens a PR when the image changed.
#
# The PR branch name is **fixed**, so repeated runs update one PR instead of opening
# a new one each time. It used to key the branch on `github.run_id`, which meant
# every release published another PR against the same file: three had piled up, two
# of them superseded — and merging the oldest would have reverted the README image to
# an older render.
#
# If `SCREENSHOT_PAT` is set (a fine-grained PAT with `contents: write` and
# `pull-requests: write`), the branch is pushed and the PR opened as that identity so
# the required CI checks actually run. With the default `GITHUB_TOKEN` they do not:
# GitHub deliberately suppresses workflow triggers for events raised by that token to
# prevent recursion, so the PR sits with zero checks and — because `main` requires
# status checks — can never be merged without an admin override. The run still succeeds in
# that case and prints how to kick the checks off by hand.
on:
  workflow_dispatch:
  release:
    types: [published]

# Read-only by default; the one job that publishes raises it itself.
permissions:
  contents: read

concurrency:
  group: screenshot
  cancel-in-progress: true

jobs:
  # Runs every piece of third-party code in this workflow — `npm ci` install
  # scripts, a full wasm build (build scripts, proc-macros), Playwright's browser
  # download — so it gets a read-only token and no secrets at all. It hands the
  # image to `publish` as an artifact.
  capture:
    name: Capture demo
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      # `ref: main` on purpose: a `release: published` run would otherwise check out
      # the tag, and the image would be rendered from whatever that commit was.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: web-rs
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: just,trunk

      # Build the demo, install Playwright + its Chromium (system deps included on
      # the Linux runner), then capture. The runner ships Node, so no setup-node.
      - name: Build the web demo
        run: just web-build
      - name: Install Playwright Chromium
        run: |
          npm --prefix scripts ci --no-audit --no-fund
          (cd scripts && npx playwright install --with-deps chromium)
      - name: Capture screenshot
        run: node scripts/screenshot.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshot
          path: docs/images/screenshot.png
          if-no-files-found: error
          retention-days: 1

  # Holds the write token, and runs nothing but git and gh on a fresh checkout of
  # main plus the downloaded image. Keeping it in its own job is the point: a
  # compromised dependency in `capture` never shares a runner with this token, so
  # it cannot read it or plant anything in .git/ for the push to execute.
  publish:
    name: Open screenshot PR
    needs: capture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # No credential is persisted into .git/config; the token is handed only to the
      # push step below — and which token it is decides whether CI runs on the PR
      # (see the note at the top).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: screenshot
          path: docs/images

      - name: Push the refreshed screenshot and open or update its PR
        env:
          GH_TOKEN: ${{ secrets.SCREENSHOT_PAT || secrets.GITHUB_TOKEN }}
          # Fixed, so every run reuses one branch and one PR.
          BRANCH: chore/refresh-screenshot
          HAVE_PAT: ${{ secrets.SCREENSHOT_PAT != '' && 'yes' || 'no' }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if git diff --quiet -- docs/images/screenshot.png; then
            echo "Screenshot unchanged — nothing to open."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Defense in depth: nothing in this job runs third-party code, but the
          # token must never meet a hook (pre-push is handed the authenticated URL).
          git config core.hooksPath /dev/null
          git checkout -B "$BRANCH"
          git add docs/images/screenshot.png
          git commit -m "docs: refresh the README demo screenshot"
          # Force needed because the branch is reused: the previous run's commit is
          # not an ancestor once main has moved on. Safe — nothing but this workflow
          # ever writes to this branch, and the image is regenerated from scratch.
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
            "HEAD:refs/heads/${BRANCH}"

          existing=$(gh pr list --head "$BRANCH" --base main --state open \
                       --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            echo "Updated existing PR #${existing} rather than opening another."
            url="https://github.com/${REPO}/pull/${existing}"
          else
            # Opening the PR needs the repo setting "Allow GitHub Actions to create
            # and approve pull requests" (off by default for security) when running
            # on GITHUB_TOKEN. If it is blocked, don't fail the run — the branch is
            # pushed; surface a one-click link so a maintainer can open it.
            if ! url=$(gh pr create --base main --head "$BRANCH" \
                  --title "docs: refresh the README demo screenshot" \
                  --body "Automated capture of the live web demo via \`scripts/screenshot.mjs\` (\`.github/workflows/screenshot.yml\`). Review the image and merge."); then
              echo "::notice title=Open the PR::Pushed ${BRANCH}; open it at https://github.com/${REPO}/compare/main...${BRANCH}?expand=1"
              exit 0
            fi
          fi

          echo "::notice title=Screenshot PR::${url}"

          if [ "$HAVE_PAT" = "no" ]; then
            echo "::warning title=CI will not run on this PR::Pushed with GITHUB_TOKEN, so GitHub suppresses the pull_request trigger and the required checks never report — the PR cannot merge as-is. Close and reopen it from a user account to trigger CI, or set a SCREENSHOT_PAT secret so this workflow pushes as a real identity."
          fi
