name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly RustSec database refresh so we catch advisories filed after merge,
    # and the weekly NinjaOne API-contract check (`ninjaone-contract`) — the vendor
    # ships on its own cadence, so a spec change has to be noticed on ours. Those
    # two are the point of the cron: the build/test jobs re-verify nothing that
    # changed since the last push, so `changes` skips them on a schedule.
    - cron: "0 6 * * 1"
  # Manual re-run of everything, including the live contract check.
  workflow_dispatch:

# A new push to the same branch/PR supersedes the in-flight run — without this
# every PR update queues a duplicate full 3-OS matrix.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token for every job. Declared explicitly so a future change
# to the repo-level default can't silently re-broaden these workflows.
permissions:
  contents: read

jobs:
  # Decides which of the gated jobs below this event needs.
  #
  # `code`: whether anything outside the docs allowlist changed. Pure-docs PRs
  # (markdown / docs/ / LICENSE-* only) skip the Rust + WASM jobs; their required
  # checks still post — as skipped → success — because this workflow always triggers
  # (a `paths-ignore` on the trigger would leave required checks stuck pending and
  # block the merge). A push to main and a manual dispatch always build; the weekly
  # cron never does (it exists for `audit` and `ninjaone-contract`).
  #
  # `contract`: whether to fetch the vendor's live spec. That job depends on a URL
  # this repo does not control, so on a PR or push it runs only when the files it
  # compares (the digest, the script, the API client) changed; the weekly cron and a
  # manual dispatch always run it.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      contract: ${{ steps.filter.outputs.contract }}
    steps:
      - name: Detect what changed
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          case "$EVENT" in
            schedule)
              printf 'code=false\ncontract=true\n' >> "$GITHUB_OUTPUT"; exit 0 ;;
            workflow_dispatch)
              printf 'code=true\ncontract=true\n' >> "$GITHUB_OUTPUT"; exit 0 ;;
            pull_request)
              files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')
              ;;
            *)
              # A push. An all-zero `before` is a new ref with nothing to diff
              # against, and the compare API caps its file list — either way,
              # an unknown change set runs everything.
              echo "code=true" >> "$GITHUB_OUTPUT"
              if [ -z "${BEFORE//0/}" ] || ! files=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --jq '.files[].filename'); then
                echo "contract=true" >> "$GITHUB_OUTPUT"; exit 0
              fi
              ;;
          esac
          # Run the Rust/WASM jobs unless every changed file is docs.
          if [ "$EVENT" = pull_request ]; then
            if printf '%s\n' "$files" | grep -qvE '(^docs/|\.md$|^LICENSE(-[A-Z]+)?$)'; then
              echo "code=true" >> "$GITHUB_OUTPUT"
            else
              echo "code=false" >> "$GITHUB_OUTPUT"
            fi
          fi
          if printf '%s\n' "$files" | grep -qE '^(docs/api/|src-tauri/src/api/|scripts/ninjaone-spec-digest\.py$|\.github/workflows/ci\.yml$)'; then
            echo "contract=true" >> "$GITHUB_OUTPUT"
          else
            echo "contract=false" >> "$GITHUB_OUTPUT"
          fi

  rust:
    name: Backend (src-tauri) (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Match the pinned MSRV in rust-toolchain.toml (which rustup honors for the
      # actual build regardless of this line) so the installed toolchain is not
      # misleadingly older than what compiles.
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: just
      - name: Install system deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      # `tauri::generate_context!` (src-tauri/src/lib.rs) reads frontendDist
      # (../web-rs/dist) at COMPILE time, so clippy/test fail without it. The dist
      # is a Trunk artifact (gitignored); a stub satisfies the macro without the
      # full WASM build (the `web` job exercises the real frontend build).
      - name: Stub frontend dist
        shell: bash
        run: |
          mkdir -p web-rs/dist
          printf '<!doctype html><title>stub</title>' > web-rs/dist/index.html
      # Formatting is target-independent — one leg is enough.
      - name: fmt (both crates)
        if: matrix.os == 'ubuntu-latest'
        run: just fmt-check
      - name: clippy
        run: just clippy
      - name: test
        run: just test

  # The single required status check for the backend. A matrix job skipped via `if`
  # posts ONE check under the un-expanded name (`...(${{ matrix.os }})`), not the
  # per-OS names, so the per-leg checks can't be the required gate on a docs-only PR.
  # This aggregates them: it always runs, and passes when the matrix succeeded or was
  # skipped for a docs-only change (and fails if any leg failed or detection broke).
  backend:
    name: Backend (src-tauri)
    needs: [changes, rust]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gate
        shell: bash
        run: |
          changes='${{ needs.changes.result }}'
          code='${{ needs.changes.outputs.code }}'
          result='${{ needs.rust.result }}'
          if [ "$changes" = "success" ] && [ "$code" != "true" ]; then
            echo "no code change for this event — backend matrix skipped"
            exit 0
          fi
          if [ "$result" != "success" ]; then
            echo "backend matrix result: $result (changes: $changes)"
            exit 1
          fi
          echo "backend matrix passed on all OSes"

  web:
    name: Frontend (Leptos/WASM)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: web-rs
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: just,trunk
      # web-rs is a separate wasm32 crate the backend `rust` job's clippy never
      # reaches — run the same gates `just verify` runs, in the same order, then
      # additionally prove it builds through Trunk (the `before*Command` path Tauri
      # uses, which `just verify` does not cover). There is no separate `web-check`
      # step: clippy performs the same type-check first, so a type error surfaces
      # here just as early, and keeping the sequence identical to `just verify` is
      # what stops the two from drifting.
      - name: clippy
        run: just web-clippy
      - name: build
        run: just web-build
      # Pure-helper unit tests run on the host target (the wasm build excludes the
      # #[cfg(test)] module); the helpers under test are JS-free.
      - name: test
        run: just web-test

  coverage:
    name: Coverage (backend)
    # Measurement-only and not a required check — run on push-to-main, not on every
    # PR (it re-compiles + re-runs the backend tests the `rust` job already covered).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # cargo-llvm-cov needs the llvm-tools-preview component for instrumentation.
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: just,cargo-llvm-cov
      - name: Install system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      # Same compile-time frontendDist stub the backend `rust` job needs.
      - name: Stub frontend dist
        shell: bash
        run: |
          mkdir -p web-rs/dist
          printf '<!doctype html><title>stub</title>' > web-rs/dist/index.html
      # Measurement only — no minimum threshold is enforced yet, so a dip never
      # fails the build. The lcov report is published as an artifact and a per-file
      # summary is surfaced on the run page; ratchet a `--fail-under-lines` gate in
      # once the baseline settles.
      - name: coverage
        run: just coverage
      - name: Summary to run page
        if: always()
        shell: bash
        run: |
          {
            echo '### Backend coverage'
            echo '```'
            cargo llvm-cov --manifest-path src-tauri/Cargo.toml report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload lcov report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: src-tauri/target/lcov.info
          if-no-files-found: error

  versions:
    name: Manifest versions agree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The two crates deliberately share no workspace (native vs wasm32 targets),
      # so the version lives in three files that are bumped by hand in lockstep.
      # release.yml already guards this — but only under
      # `if: startsWith(github.ref, 'refs/tags/')`, i.e. after the tag and its
      # irreversible release run have been pushed, which is the expensive place to
      # find out. Checking mutual agreement here needs no tag and catches the
      # mistake in review instead — and every release and many dependency bumps
      # touch these manifests, so it is a path the repo takes constantly.
      - name: Check the three manifests carry the same version
        run: |
          conf=$(jq -r '.version' src-tauri/tauri.conf.json)
          cargo_v=$(grep -m1 -E '^version = ' src-tauri/Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')
          web_v=$(grep -m1 -E '^version = ' web-rs/Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')
          echo "tauri.conf.json=$conf src-tauri=$cargo_v web-rs=$web_v"
          if [ "$conf" != "$cargo_v" ] || [ "$conf" != "$web_v" ]; then
            echo "::error::version mismatch — src-tauri/tauri.conf.json, src-tauri/Cargo.toml and web-rs/Cargo.toml must all carry the same version"
            exit 1
          fi
          echo "all three manifests agree on v$conf — ok"

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Workflow-file syntax gate. Pinned by version + checksum (no install-action
      # manifest exists).
      - name: actionlint
        run: |
          curl -sSfL -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Claude hook scripts gate commits/docs locally; lint them in CI too so a
      # broken hook is caught here, not when it silently fails to fire. shellcheck is
      # preinstalled on the ubuntu-latest runner.
      - name: shellcheck
        run: shellcheck .claude/hooks/*.sh .githooks/* scripts/*.sh
      # The hooks' own self-tests. `test.sh` records that a parity assertion was
      # wrong for months precisely because nothing ran it — shellcheck proves the
      # scripts parse, not that they still decide correctly.
      - name: hook self-tests
        run: .claude/hooks/test.sh

  commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # PR commits only: PRs land on `main` as merge commits, so every non-merge
    # commit there already passed this check on its PR — and commits from before
    # this gate existed must not fail it.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The same rule as .githooks/commit-msg, applied to everyone. That hook needs
      # `just setup` in each clone (core.hooksPath is local config and cannot be
      # committed), so this is the gate for a contributor who never ran it.
      - name: Check commit subjects
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          while IFS= read -r subject; do
            case "$subject" in
              "Merge "*|"Revert "*|"fixup!"*|"squash!"*|"amend!"*|"") continue ;;
            esac
            if printf '%s' "$subject" | grep -Eq '^(feat|fix|docs|chore|refactor|test|build|ci|perf|style|revert|deps)(\([^)]+\))?!?: .+$'; then
              echo "ok   $subject"
            else
              echo "FAIL $subject" >&2
              fail=1
            fi
          done < <(git log --format=%s "$BASE..$HEAD")
          exit "$fail"

  licenses:
    name: Third-party licenses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # deny.toml gates which licenses may come IN; this is the outbound half —
      # the bundle statically links crates whose terms require reproducing their
      # notices in a distribution. Two hand-maintained copies of one policy is the
      # drift this repo keeps finding, so the lists are checked against each other
      # before the notice is regenerated.
      - name: License policy lists agree
        run: ./scripts/check-license-lists.sh
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: just,cargo-about
      - name: THIRD-PARTY-LICENSES.md is current
        run: |
          just licenses
          if ! git diff --quiet -- THIRD-PARTY-LICENSES.md; then
            echo "THIRD-PARTY-LICENSES.md is stale — run 'just licenses' and commit." >&2
            git diff --stat -- THIRD-PARTY-LICENSES.md >&2
            exit 1
          fi

  ninjaone-contract:
    name: NinjaOne API contract
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Every backend test mocks NinjaOne against hand-written fixtures, so the suite
      # asserts what this build BELIEVES the API returns, not what it returns. The
      # 0.13.3 `is_pending` bug was exactly that: the code assumed an allow-list of
      # three statuses while the vendor's own endpoint titles promise more. Nothing
      # gated AGENTS.md's instruction to verify shapes against the spec.
      #
      # This re-derives the digest of the surface we consume and fails when it moves.
      # A failure is not necessarily a break — it is the signal to read the diff and
      # decide whether a vendor change invalidates an assumption in model.rs,
      # filter.rs or rows/.
      - name: Fetch the published spec
        run: |
          curl -sSfL --retry 3 --retry-delay 5 \
            -o /tmp/ninjaone-spec.yaml \
            https://app.ninjarmm.com/apidocs-beta/NinjaRMM-API-v2.yaml
      - name: Re-derive the surface digest
        run: python3 scripts/ninjaone-spec-digest.py /tmp/ninjaone-spec.yaml > /tmp/surface.md
      - name: Compare against the committed snapshot
        run: |
          if diff -u docs/api/ninjaone-surface.md /tmp/surface.md; then
            echo "NinjaOne's API surface is unchanged."
            exit 0
          fi
          cat >&2 <<'MSG'

          NinjaOne's published spec no longer matches docs/api/ninjaone-surface.md.

          Read the diff above and decide what it means:
            * a new enum value on a field the code branches on -> check
              Severity::from_raw, rows::is_pending, actions::is_action_activity
            * a field that became free-form -> the parser must stay total
            * a removed or renamed endpoint -> a code path is already broken
          Then run:  python3 scripts/ninjaone-spec-digest.py <spec> > docs/api/ninjaone-surface.md
          and commit the result with the reasoning in the message.
          MSG
          exit 1

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # RustSec advisory scan via the same `just` recipe run locally. The recipe
      # covers BOTH lockfiles: src-tauri/Cargo.lock and the frontend's own
      # web-rs/Cargo.lock (the two crates carry independent lockfiles).
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: just,cargo-audit
      - name: audit (both lockfiles)
        run: just audit

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # License + supply-chain (sources) + bans policy from deny.toml, over both
      # crates' trees, via the same `just` recipes used locally. RustSec
      # advisories are NOT re-checked here — the `audit` job (cargo-audit) owns
      # those, so the two gates don't overlap.
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: just,cargo-deny
      - name: deny (backend)
        run: just deny
      - name: deny (frontend)
        run: just web-deny
