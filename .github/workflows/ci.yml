name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly RustSec database refresh so we catch advisories filed after merge.
    - cron: "0 6 * * 1"

# A new push to the same branch/PR supersedes the in-flight run — without this
# every PR update queues a duplicate full 3-OS matrix.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token for every job. Declared explicitly so a future change
# to the repo-level default can't silently re-broaden these workflows.
permissions:
  contents: read

jobs:
  # Detects whether a PR touches anything outside the docs allowlist. Pure-docs PRs
  # (markdown / docs/ / LICENSE only) skip the Rust + WASM jobs below; their required
  # checks still post — as skipped → success — because this workflow always triggers
  # (a `paths-ignore` on the trigger would leave required checks stuck pending and
  # block the merge). Non-PR events (push to main, weekly cron) always run everything.
  #
  # Also reports whether the screenshot tooling changed, which gates the expensive
  # end-to-end capture job (see `screenshot-capture`).
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - name: Detect non-docs changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            # The end-to-end capture is heavy, so don't run it on every merge to
            # main; the weekly cron covers upstream drift (a Playwright or Chromium
            # release that breaks the tool without any commit of ours touching it).
            if [ "${{ github.event_name }}" = "schedule" ]; then
              echo "scripts=true" >> "$GITHUB_OUTPUT"
            else
              echo "scripts=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          files=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[].filename')
          # Run the Rust/WASM jobs unless every changed file is docs.
          if printf '%s\n' "$files" | grep -qvE '(^docs/|\.md$|^LICENSE$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          # The capture is only worth its runtime when the tool, its dependencies,
          # the recipe that drives it or the workflow that runs it actually changed.
          if printf '%s\n' "$files" | grep -qE '(^scripts/|^justfile$|^\.github/workflows/screenshot\.yml$)'; then
            echo "scripts=true" >> "$GITHUB_OUTPUT"
          else
            echo "scripts=false" >> "$GITHUB_OUTPUT"
          fi

  rust:
    name: Backend (src-tauri) (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Match the pinned MSRV in rust-toolchain.toml (which rustup honors for the
      # actual build regardless of this line) so the installed toolchain is not
      # misleadingly older than what compiles.
      - uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e # 1.96.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: just
      - name: Install system deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      # `tauri::generate_context!` (src-tauri/src/lib.rs) reads frontendDist
      # (../web-rs/dist) at COMPILE time, so clippy/test fail without it. The dist
      # is a Trunk artifact (gitignored); a stub satisfies the macro without the
      # full WASM build (the `web` job exercises the real frontend build).
      - name: Stub frontend dist
        shell: bash
        run: |
          mkdir -p web-rs/dist
          printf '<!doctype html><title>stub</title>' > web-rs/dist/index.html
      - name: fmt (both crates)
        run: just fmt-check
      - name: clippy
        run: just clippy
      - name: test
        run: just test

  # The single required status check for the backend. A matrix job skipped via `if`
  # posts ONE check under the un-expanded name (`...(${{ matrix.os }})`), not the
  # per-OS names, so the per-leg checks can't be the required gate on a docs-only PR.
  # This aggregates them: it always runs, and passes when the matrix succeeded or was
  # skipped for a docs-only change (and fails if any leg failed or detection broke).
  backend:
    name: Backend (src-tauri)
    needs: [changes, rust]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        shell: bash
        run: |
          changes='${{ needs.changes.result }}'
          code='${{ needs.changes.outputs.code }}'
          result='${{ needs.rust.result }}'
          if [ "$changes" = "success" ] && [ "$code" != "true" ]; then
            echo "docs-only change — backend matrix skipped"
            exit 0
          fi
          if [ "$result" != "success" ]; then
            echo "backend matrix result: $result (changes: $changes)"
            exit 1
          fi
          echo "backend matrix passed on all OSes"

  web:
    name: Frontend (Leptos/WASM)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e # 1.96.0
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: web-rs
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: just,trunk
      # web-rs is a separate wasm32 crate the backend `rust` job's clippy never
      # reaches — run the same gates `just verify` runs, in the same order, then
      # additionally prove it builds through Trunk (the `before*Command` path Tauri
      # uses, which `just verify` does not cover).
      #
      # `web-check` is listed explicitly even though `web-build` subsumes it: the
      # justfile and AGENTS.md both name it as part of the canonical chain, and a
      # CI sequence that quietly differs from the documented one is how the two
      # drift. It is also the faster failure — a type error surfaces here rather
      # than after Trunk's bundling.
      - name: check
        run: just web-check
      - name: clippy
        run: just web-clippy
      - name: build
        run: just web-build
      # Pure-helper unit tests run on the host target (the wasm build excludes the
      # #[cfg(test)] module); the helpers under test are JS-free.
      - name: test
        run: just web-test

  # The screenshot tooling (scripts/) is a dev/CI tool, but screenshot.yml runs it on
  # every published release to refresh the README image — and until now NO job
  # exercised it, so a break in it surfaced at release time. That is not theoretical:
  # `selfsigned` 2 -> 5 made `generate` async, and the un-awaited call built an HTTPS
  # server with undefined key/cert. It is also unwatched by Dependabot's cargo
  # entries, so npm drift is the likeliest way it rots.
  #
  # This job is the cheap half: no Chromium, no built dist, seconds to run, so it
  # rides along on every PR (including the Dependabot npm PRs that bump these very
  # packages). The end-to-end capture is the separate, path-gated job below.
  screenshot-tooling:
    name: Screenshot tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: just
      # Via the same `just` recipe that is documented and run locally — a CI
      # sequence that quietly differs from the documented one is how the two drift.
      # The runner ships Node, so no setup-node.
      - name: test
        run: just screenshot-test

  # The expensive half: build the real demo and drive it through headless Chromium,
  # exactly as screenshot.yml does, proving the whole path still works. Gated on the
  # tooling actually changing (or the weekly cron) because it costs a WASM build plus
  # a Chromium download. Writes to a scratch path — regenerating the committed PNG is
  # screenshot.yml's job, not this one's.
  screenshot-capture:
    name: Screenshot capture (end-to-end)
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e # 1.96.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: web-rs
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: just,trunk
      - name: Build the web demo
        run: just web-build
      - name: Install Playwright Chromium
        run: |
          npm --prefix scripts install --no-audit --no-fund
          (cd scripts && npx playwright install --with-deps chromium)
      - name: Capture to a scratch path
        env:
          SCREENSHOT_OUT: ${{ runner.temp }}/screenshot.png
        run: node scripts/screenshot.mjs
      - name: Check the capture produced a real PNG
        env:
          SHOT: ${{ runner.temp }}/screenshot.png
        shell: bash
        run: |
          # The script exiting 0 is not enough: assert it wrote a non-trivial PNG,
          # and that it left the committed image alone.
          test -s "$SHOT"
          file "$SHOT" | grep -q 'PNG image data'
          bytes=$(wc -c < "$SHOT")
          echo "captured $bytes bytes"
          [ "$bytes" -gt 10000 ] || { echo "::error::capture is suspiciously small"; exit 1; }
          if ! git diff --quiet -- docs/images/screenshot.png; then
            echo "::error::the capture overwrote the committed screenshot"
            exit 1
          fi

  coverage:
    name: Coverage (backend)
    # Measurement-only and not a required check — run on push-to-main, not on every
    # PR (it re-compiles + re-runs the backend tests the `rust` job already covered).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # cargo-llvm-cov needs the llvm-tools-preview component for instrumentation.
      - uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e # 1.96.0
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: just,cargo-llvm-cov
      - name: Install system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      # Same compile-time frontendDist stub the backend `rust` job needs.
      - name: Stub frontend dist
        shell: bash
        run: |
          mkdir -p web-rs/dist
          printf '<!doctype html><title>stub</title>' > web-rs/dist/index.html
      # Measurement only — no minimum threshold is enforced yet, so a dip never
      # fails the build. The lcov report is published as an artifact and a per-file
      # summary is surfaced on the run page; ratchet a `--fail-under-lines` gate in
      # once the baseline settles.
      - name: coverage
        run: just coverage
      - name: Summary to run page
        if: always()
        shell: bash
        run: |
          {
            echo '### Backend coverage'
            echo '```'
            cargo llvm-cov --manifest-path src-tauri/Cargo.toml report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload lcov report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: src-tauri/target/lcov.info
          if-no-files-found: error

  versions:
    name: Manifest versions agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The two crates deliberately share no workspace (native vs wasm32 targets),
      # so the version lives in three files that are bumped by hand in lockstep.
      # release.yml already guards this — but only under
      # `if: startsWith(github.ref, 'refs/tags/')`, i.e. after the tag and its
      # irreversible release run have been pushed, which is the expensive place to
      # find out. Checking mutual agreement here needs no tag and catches the
      # mistake in review instead.
      #
      # Worth a job of its own: src-tauri/Cargo.toml co-changes with
      # web-rs/Cargo.toml in 23 of the last 300 commits and with tauri.conf.json in
      # 22, so this is a path the repo takes constantly.
      - name: Check the three manifests carry the same version
        run: |
          conf=$(jq -r '.version' src-tauri/tauri.conf.json)
          cargo_v=$(grep -m1 -E '^version = ' src-tauri/Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')
          web_v=$(grep -m1 -E '^version = ' web-rs/Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')
          echo "tauri.conf.json=$conf src-tauri=$cargo_v web-rs=$web_v"
          if [ "$conf" != "$cargo_v" ] || [ "$conf" != "$web_v" ]; then
            echo "::error::version mismatch — src-tauri/tauri.conf.json, src-tauri/Cargo.toml and web-rs/Cargo.toml must all carry the same version"
            exit 1
          fi
          echo "all three manifests agree on v$conf — ok"

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Workflow-file syntax gate. Pinned by version + checksum (no install-action
      # manifest exists).
      - name: actionlint
        run: |
          curl -sSfL -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Claude hook scripts gate commits/docs locally; lint them in CI too so a
      # broken hook is caught here, not when it silently fails to fire. shellcheck is
      # preinstalled on the ubuntu-latest runner.
      - name: shellcheck
        run: shellcheck .claude/hooks/*.sh

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # RustSec advisory scan via the same `just` recipe run locally. The recipe
      # covers BOTH lockfiles: src-tauri/Cargo.lock and the frontend's own
      # web-rs/Cargo.lock (the two crates carry independent lockfiles).
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: just,cargo-audit
      - name: audit (both lockfiles)
        run: just audit

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # License + supply-chain (sources) + bans policy from deny.toml, over both
      # crates' trees, via the same `just` recipes used locally. RustSec
      # advisories are NOT re-checked here — the `audit` job (cargo-audit) owns
      # those, so the two gates don't overlap.
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: just,cargo-deny
      - name: deny (backend)
        run: just deny
      - name: deny (frontend)
        run: just web-deny
