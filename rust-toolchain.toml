# The full patch version, not "1.100": rustup treats "1.100" and "1.100.0" as two
# different toolchains, so CI's `dtolnay/rust-toolchain@… # 1.100.0` step (and the
# extra components it installs, e.g. llvm-tools-preview for coverage) would land on
# a toolchain this file then overrides. Bump it together with every workflow's
# dtolnay pin.
[toolchain]
channel = "1.100.0"
components = ["rustfmt", "clippy"]
targets = ["wasm32-unknown-unknown"]
