[package]
name = "ninjaone-patch-toolkit"
version = "0.13.1"
edition = "2024"
rust-version = "1.96"
description = "PKCE-authenticated NinjaOne patching-operations toolkit (Tauri 2 + Leptos)"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "ninjaone_patch_toolkit_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ninjaone-patch-toolkit"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
anyhow = "1.0"
# `simd-unsafe` is on by default in 0.23 and is the crate's *only* source of
# `unsafe`; without it base64 is `#![forbid(unsafe_code)]`. It only accelerates the
# `Simd`/`Avx2`/`Neon` engines, and we exclusively use the scalar
# `general_purpose::{STANDARD, URL_SAFE_NO_PAD}` — so turning it off costs nothing
# and removes the only unsafe code in our dependency's own source.
#
# As with reqwest below, `default-features = false` drops `std` too, so it has to be
# re-added by hand — dropping it silently would push the crate to `no_std` and take
# the allocating `encode`/`decode` APIs with it.
base64 = { version = "0.23", default-features = false, features = ["std"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "6.0"
keyring = "4"
open = "5.3"
rand = "0.10"
# `default-features = false` pins the TLS backend to rustls, but it also drops
# reqwest's other defaults — `charset`, `http2`, and `system-proxy` — so each is
# re-added explicitly. `http2` matters because a cold query fans out five
# concurrent whole-fleet fetches: without it every one needs its own TCP+TLS
# handshake instead of multiplexing over a single connection. `system-proxy`
# reads the OS proxy configuration (macOS System Settings / WinINET), which is
# how a managed desktop is usually configured — without it those operators
# cannot reach NinjaOne at all. `gzip` is the single biggest byte-count lever:
# the reporting feeds are six-figure row counts of repetitive JSON, and reqwest
# only sends `Accept-Encoding` when the feature is compiled in.
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query", "rustls", "charset", "http2", "system-proxy", "gzip"] }
rust_xlsxwriter = "0.99"
serde = { version = "1.0", features = ["derive"] }
# `raw_value` lets the paginated fetchers look at the `{ results, cursor }` wrapper
# without parsing the rows inside it, so a six-figure patch feed is deserialized
# once, straight into `Vec<Patch>`, instead of through a discarded `Value` tree.
# See `api::parse_page`.
serde_json = { version = "1.0", features = ["raw_value"] }
sha2 = "0.11"
tokio = { version = "1.42", features = ["rt-multi-thread", "net", "sync", "macros", "time", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
urlencoding = "2.1"

[dev-dependencies]
calamine = "0.36"
wiremock = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
